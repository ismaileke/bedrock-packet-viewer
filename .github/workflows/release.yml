name: Rust Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Linux için iced sistem bağımlılıkları
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Build release
        run: cargo build --release

      # Windows binary rename + upload
      - name: Upload Windows binary
        if: matrix.os == 'windows-latest'
        run: |
          cp target/release/bedrock_packet_viewer.exe bedrock_packet_viewer-windows.exe
        shell: bash

      - name: Release Windows asset
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: bedrock_packet_viewer-windows.exe
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Linux binary rename + upload
      - name: Upload Linux binary
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp target/release/bedrock_packet_viewer bedrock_packet_viewer-linux
          chmod +x bedrock_packet_viewer-linux

      - name: Release Linux asset
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: bedrock_packet_viewer-linux
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # macOS binary rename + upload
      - name: Upload macOS binary
        if: matrix.os == 'macos-latest'
        run: |
          cp target/release/bedrock_packet_viewer bedrock_packet_viewer-macos
          chmod +x bedrock_packet_viewer-macos

      - name: Release macOS asset
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: bedrock_packet_viewer-macos
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
